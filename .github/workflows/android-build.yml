name: Android validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ -z "$sdk_root" || ! -x "$sdk_manager" ]]; then
            echo "::error::Preinstalled Android SDK manager was not found"
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$sdk_root" > local.properties
          if [[ ! -f "$sdk_root/platforms/android-35/android.jar" || ! -x "$sdk_root/build-tools/35.0.0/aapt2" ]]; then
            "$sdk_manager" --sdk_root="$sdk_root" "platforms;android-35" "build-tools;35.0.0"
          fi
          echo "Android SDK ready: $sdk_root"

      - name: Compile debug APK
        shell: bash
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-validation-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
